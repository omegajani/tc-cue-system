<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TC Cue System – Demo</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --muted: #9ca3af;
      --accent: #f59e0b;
      --ok: #10b981;
      --warn: #f97316;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.4;
    }
    .container {
      width: min(1100px, 100% - 2rem);
      margin: 1.5rem auto 2rem;
      display: grid;
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }
    h1, h2, h3 { margin: 0 0 .7rem; }
    .muted { color: var(--muted); }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .tc {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
      color: var(--accent);
      font-weight: 700;
    }
    .row {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    button {
      background: #27272a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .75rem;
      cursor: pointer;
    }
    button:hover { border-color: #52525b; }
    .active-cue {
      border-left: 4px solid var(--ok);
      padding-left: .75rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      border-bottom: 1px solid var(--border);
      padding: .5rem .35rem;
      font-size: .95rem;
    }
    .cue-fired { color: var(--muted); }
    .pill {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: .1rem .45rem;
      font-size: .75rem;
      margin-left: .35rem;
    }
    .pill.fired { color: var(--ok); border-color: var(--ok); }
    .pill.next { color: var(--warn); border-color: var(--warn); }
    ul { margin: 0; padding-left: 1.1rem; }
    li + li { margin-top: .25rem; }
    .checklist-item.done { text-decoration: line-through; color: var(--muted); }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="toolbar">
        <div>
          <h1>TC Cue System – Demo</h1>
          <p class="muted">GitHub Pages Demo mit Beispielsongs, Cues und Listen. Läuft komplett statisch und verändert die Hauptanwendung nicht.</p>
        </div>
        <div>
          <button id="toggle">Start</button>
          <button id="reset">Reset</button>
        </div>
      </div>
      <p id="tc" class="tc">00:00:00:00</p>
    </section>

    <section class="row">
      <article class="card">
        <h2>Aktueller Cue</h2>
        <div id="currentCue" class="active-cue muted">Noch kein Cue ausgelöst.</div>
      </article>

      <article class="card">
        <h2>Songs</h2>
        <table>
          <thead><tr><th>Song</th><th>Start</th><th>Ende</th></tr></thead>
          <tbody id="songsBody"></tbody>
        </table>
      </article>
    </section>

    <section class="card">
      <h2>Cues</h2>
      <table>
        <thead><tr><th>TC</th><th>Titel</th><th>Nachricht</th><th>Status</th></tr></thead>
        <tbody id="cuesBody"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Checklisten</h2>
      <div id="checklists"></div>
    </section>
  </main>

  <script>
    const FPS = 25;

    const demo = {
      songs: [
        { id: 'song-1', name: 'Einladung', startTc: '00:00:00:00', endTc: '00:00:45:00' },
        { id: 'song-2', name: 'Wovon träumst du', startTc: '00:00:45:00', endTc: '00:01:30:00' },
        { id: 'song-3', name: 'Lift off', startTc: '00:01:30:00', endTc: '00:02:15:00' }
      ],
      cues: [
        { id: 'cue-1', tc: '00:00:10:00', title: 'Licht Blackout', message: 'Licht auf Blackout setzen.' },
        { id: 'cue-2', tc: '00:00:36:00', title: 'Umbau bereit', message: 'Umbauposition auf Bühne freigeben.' },
        { id: 'cue-3', tc: '00:01:05:00', title: 'Nebel Start', message: 'Nebelmaschine für Song 2 aktivieren.' },
        { id: 'cue-4', tc: '00:01:58:00', title: 'Finale Spot', message: 'Finalen Spot auf Center fahren.' }
      ],
      checklists: [
        {
          title: 'Vor Showstart',
          trigger: { type: 'before-first-cue' },
          items: ['Mikros prüfen', 'Monitorpegel kontrollieren', 'Lichtpult Szene laden']
        },
        {
          title: 'Nach Cue „Umbau bereit“',
          trigger: { type: 'after-cue', cueId: 'cue-2' },
          items: ['Bühnenelement links sichern', 'Seitengasse frei melden']
        }
      ]
    };

    const state = { running: false, frame: 0, timer: null };

    const tcEl = document.getElementById('tc');
    const toggleBtn = document.getElementById('toggle');
    const resetBtn = document.getElementById('reset');
    const cuesBody = document.getElementById('cuesBody');
    const songsBody = document.getElementById('songsBody');
    const currentCue = document.getElementById('currentCue');
    const checklists = document.getElementById('checklists');

    const toFrames = (tc) => {
      const [h, m, s, f] = tc.split(':').map(Number);
      return ((((h * 60) + m) * 60) + s) * FPS + f;
    };

    const toTc = (totalFrames) => {
      const frame = totalFrames % FPS;
      const secTotal = Math.floor(totalFrames / FPS);
      const sec = secTotal % 60;
      const minTotal = Math.floor(secTotal / 60);
      const min = minTotal % 60;
      const hour = Math.floor(minTotal / 60);
      return [hour, min, sec, frame].map((n) => String(n).padStart(2, '0')).join(':');
    };

    const renderSongs = () => {
      songsBody.innerHTML = demo.songs
        .map((s) => `<tr><td>${s.name}</td><td>${s.startTc}</td><td>${s.endTc}</td></tr>`)
        .join('');
    };

    const cueRows = demo.cues
      .map((cue) => ({ ...cue, frame: toFrames(cue.tc) }))
      .sort((a, b) => a.frame - b.frame);

    const renderChecklists = () => {
      checklists.innerHTML = demo.checklists.map((list) => {
        let cueTriggered = false;
        let triggerCue = null;
        if (list.trigger.type === 'before-first-cue') {
          cueTriggered = cueRows.length > 0 && state.frame >= cueRows[0].frame;
        }
        if (list.trigger.type === 'after-cue') {
          triggerCue = cueRows.find((cue) => cue.id === list.trigger.cueId) ?? null;
          cueTriggered = Boolean(triggerCue) && state.frame >= triggerCue.frame;
        }
        const triggerText = list.trigger.type === 'before-first-cue'
          ? 'Vor erstem Cue'
          : `Nach ${triggerCue?.title ?? list.trigger.cueId}`;
        const items = list.items.map((item) => {
          const done = cueTriggered ? 'done' : '';
          return `<li class="checklist-item ${done}">${item}</li>`;
        }).join('');
        return `
          <article style="margin-bottom:.75rem; padding:.75rem; border:1px solid var(--border); border-radius:8px;">
            <h3>${list.title}</h3>
            <p class="muted" style="margin-bottom:.4rem;">Trigger: ${triggerText}</p>
            <ul>${items}</ul>
          </article>
        `;
      }).join('');
    };

    const renderTimeline = () => {
      const tc = toTc(state.frame);
      tcEl.textContent = tc;

      let firedCue = null;
      const nextCue = cueRows.find((candidate) => candidate.frame > state.frame);
      const rows = cueRows.map((cue) => {
        const fired = cue.frame <= state.frame;
        if (fired) firedCue = cue;
        const next = nextCue ? nextCue.id === cue.id : false;
        return `
          <tr class="${fired ? 'cue-fired' : ''}">
            <td>${cue.tc}</td>
            <td>${cue.title}</td>
            <td>${cue.message}</td>
            <td>
              ${fired ? '<span class="pill fired">ausgelöst</span>' : ''}
              ${next ? '<span class="pill next">als Nächstes</span>' : ''}
            </td>
          </tr>
        `;
      }).join('');

      cuesBody.innerHTML = rows;

      if (firedCue) {
        currentCue.classList.remove('muted');
        currentCue.innerHTML = `<strong>${firedCue.title}</strong><br>${firedCue.message} <span class="pill fired">${firedCue.tc}</span>`;
      } else {
        currentCue.classList.add('muted');
        currentCue.textContent = 'Noch kein Cue ausgelöst.';
      }

      renderChecklists();
    };

    const tick = () => {
      state.frame += 1;
      const end = toFrames('00:02:30:00');
      if (state.frame > end) state.frame = 0;
      renderTimeline();
    };

    toggleBtn.addEventListener('click', () => {
      state.running = !state.running;
      toggleBtn.textContent = state.running ? 'Pause' : 'Start';
      if (state.running) {
        state.timer = window.setInterval(tick, 1000 / FPS);
      } else {
        window.clearInterval(state.timer);
        state.timer = null;
      }
    });

    resetBtn.addEventListener('click', () => {
      state.frame = 0;
      renderTimeline();
    });

    renderSongs();
    renderTimeline();
  </script>
</body>
</html>
