<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ql-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171f"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="ql-amber" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b4730a"/>
    </linearGradient>
    <linearGradient id="ql-amber-bright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="ql-glow" cx="0.42" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#ql-bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#ql-glow)"/>

  <!-- Q-Ring -->
  <circle cx="500" cy="512" r="262" fill="none" stroke="url(#ql-amber)" stroke-width="104"/>
  <!-- dezenter oberer Lichtsaum für Tiefe -->
  <path d="M 322 330 A 262 262 0 0 1 690 330" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="20" stroke-linecap="round"/>

  <!-- Cue-/Play-Dreieck als Q-Schwanz (unten rechts) -->
  <g transform="translate(690 706) rotate(42)">
    <path d="M -78 -88 L -78 88 L 96 0 Z"
          fill="url(#ql-amber-bright)"
          stroke="#070709" stroke-width="34" stroke-linejoin="round"/>
  </g>
</svg>
